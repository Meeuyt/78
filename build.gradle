plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '1.0.0'
group = 'com.simplymore.epicfight'

java {
    archivesBaseName = 'simplymore-epicfight'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                simplymoreepicfight {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                simplymoreepicfight {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'simplymoreepicfight', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                simplymoreepicfight {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://maven.epicfight.dev/"
        content {
            includeGroup "dev.epicfight"
        }
    }
    maven {
        url "https://maven.simplyswords.dev/"
        content {
            includeGroup "com.simplyswords"
        }
    }
    maven {
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
        }
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Epic Fight from official Maven
    implementation fg.deobf("dev.epicfight:epicfight:20.14.17")

    // Simply Swords
    implementation fg.deobf("com.simplyswords:simplyswords:1.70.2")

    // Simply More
    implementation fg.deobf("curse.maven:simply-more-1095252:8736447")

    // Cloth Config
    implementation fg.deobf("me.shedaniel:cloth-config:11.1.106")

    // Architectury
    implementation fg.deobf("dev.architectury:architectury:11.0.0")
}

jar {
    manifest {
        attributes([
                "Specification-Title": "simplymore-epicfight",
                "Specification-Vendor": "SimplyMoreEpicFight",
                "Specification-Version": "1.0.0",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "SimplyMoreEpicFight",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/maven"
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateDataPack') {
    group = 'simplymoreepicfight'
    description = 'Generates weapon capability JSON files for the data pack'
    doLast {
        exec {
            commandLine 'bash', 'generate_weapons.sh'
        }
    }
}

tasks.named('processResources') {
    dependsOn 'generateDataPack'
}
