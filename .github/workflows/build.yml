name: Build Simply More Epic Fight

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Gradle
        run: |
          mkdir -p gradle/dist
          cd gradle/dist
          curl -L -o gradle-8.5-bin.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q gradle-8.5-bin.zip
          echo "GRADLE_HOME=$GITHUB_WORKSPACE/gradle/dist/gradle-8.5" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
      
      - name: Epic Fight API
        run: echo "Using local libs/epicfight.jar (compileOnly)"
      
      - name: Generate Data Pack
        run: bash generate_weapons.sh
      
      - name: Build with Gradle
        run: $GRADLE_HOME/bin/gradle build --stacktrace
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplymore-epicfight
          path: build/libs/*.jar
          retention-days: 30
      
      - name: Upload Data Pack
        uses: actions/upload-artifact@v4
        with:
          name: simplymore-epicfight-datapack
          path: src/main/resources/data/simplymore/**
          retention-days: 30
