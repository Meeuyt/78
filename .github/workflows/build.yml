name: Build Simply More Epic Fight

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Gradle
        run: |
          mkdir -p gradle/dist
          cd gradle/dist
          curl -L -o gradle-8.5-bin.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q gradle-8.5-bin.zip
          echo "GRADLE_HOME=$GITHUB_WORKSPACE/gradle/dist/gradle-8.5" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
      
      - name: Install Epic Fight to local Maven
        run: |
          mkdir -p /home/runner/.gradle/caches/forge_gradle/bundled_deobf_repo/curse/maven/epicfight-mod-405076/7345468_mapped_official_1.20.1/
          curl -L -o /tmp/epicfight.jar "https://www.curseforge.com/minecraft/mc-mods/epic-fight-mod/files/8049910/download"
          cp /tmp/epicfight.jar /home/runner/.gradle/caches/forge_gradle/bundled_deobf_repo/curse/maven/epicfight-mod-405076/7345468_mapped_official_1.20.1/epicfight-mod-405076-7345468_mapped_official_1.20.1.jar
          cat > /home/runner/.gradle/caches/forge_gradle/bundled_deobf_repo/curse/maven/epicfight-mod-405076/7345468_mapped_official_1.20.1/epicfight-mod-405076-7345468_mapped_official_1.20.1.pom << 'EOF'
          <dependency>
            <groupId>curse.maven</groupId>
            <artifactId>epicfight-mod-405076</artifactId>
            <version>7345468_mapped_official_1.20.1</version>
          </dependency>
          EOF
      
      - name: Generate Data Pack
        run: bash generate_weapons.sh
      
      - name: Build with Gradle
        run: $GRADLE_HOME/bin/gradle build --stacktrace
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplymore-epicfight
          path: build/libs/*.jar
          retention-days: 30
      
      - name: Upload Data Pack
        uses: actions/upload-artifact@v4
        with:
          name: simplymore-epicfight-datapack
          path: src/main/resources/data/simplymore/**
          retention-days: 30
